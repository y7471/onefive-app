<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.tip-box{margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:13.5px;line-height:1.6}
.tip-box summary{cursor:pointer;font-weight:600}
.tip-box ol{margin:8px 0 2px;padding-left:20px}
.hint{color:var(--muted);font-size:13px;margin:4px 2px}
.spen{max-width:640px;margin:10px auto 0;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--hb1,#3E5A92) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--hb1,#3E5A92) 22%,transparent);font-size:14px;line-height:1.6}
.spen summary{cursor:pointer;font-weight:700;color:var(--ink)}
.spen ol{margin:8px 0 4px;padding-left:20px}
.spen p{margin:6px 0;color:var(--muted);font-size:13px}
.spen button{margin-top:4px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer}
.pgame{max-width:640px;margin:10px auto 0;padding:10px 14px 12px;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--hb1,#3E5A92),var(--hb2,#C48A5A));box-shadow:0 6px 18px color-mix(in srgb,var(--hb1,#3E5A92) 30%,transparent)}
.pgame .hon{font-size:12px;font-weight:700;color:#FFE7A3;letter-spacing:.02em;min-height:0}
.pgame .hon:empty{display:none}
.pgame .row{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.pgame .lv{font-size:20px;font-family:'Lora',serif}
.pgame .nm{font-weight:700;font-size:15px;flex:1}
.pgame .xpt{font-size:11.5px;opacity:.85}
.pgame .xpb{height:7px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:6px}
.pgame .xpf{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#FFE7A3,#FFFFFF);transition:width .6s ease}
.pcard{position:relative}
.xpfloat{position:absolute;right:18px;top:10px;font-weight:800;color:var(--ok,#2E8B57);font-size:18px;animation:xpup 1.3s ease-out forwards;pointer-events:none}
@keyframes xpup{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-40px)}}
.lvup{position:fixed;inset:0;z-index:80;background:rgba(15,10,30,.55);display:grid;place-items:center;overflow:hidden;animation:fadein .2s}
.lvup .lvbox{position:relative;z-index:2;width:min(86vw,360px);padding:26px 22px 20px;border-radius:22px;text-align:center;color:#fff;background:linear-gradient(150deg,var(--hb1,#3E5A92),var(--hb2,#C48A5A));box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.lvup.big .lvbox{background:linear-gradient(150deg,#3A2A0E,#B8862E 60%,#F2D27A);color:#fff}
.lvup .lvt{font-size:24px;font-weight:800;font-family:'Lora',var(--ko),serif}
.lvup .lvs{margin-top:8px;font-size:15px;line-height:1.55;opacity:.95}
.lvup button{margin-top:16px;padding:11px 18px;border:0;border-radius:12px;background:#fff;color:#2B2150;font-weight:700;font-size:15px;cursor:pointer}
.lvup i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;z-index:1;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}}
.gcard{padding:16px;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--hb1,#3E5A92),var(--hb2,#C48A5A));margin-bottom:10px}
.gcard .hon{color:#FFE7A3;font-weight:700;font-size:13px}
.gcard .big2{font-size:26px;font-weight:800;font-family:'Lora',var(--ko),serif;margin-top:2px}
.gcard .big2 small{font-size:16px;font-weight:700;margin-left:6px;font-family:var(--ko)}
.gcard .xpb{height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin:8px 0 4px}
.gcard .xpb i{display:block;height:100%;background:linear-gradient(90deg,#FFE7A3,#fff)}
.gcard .meta{font-size:12.5px;opacity:.9;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gcard details{margin-top:10px;font-size:13px}
.gcard summary{cursor:pointer;font-weight:700}
.gcard table{width:100%;border-collapse:collapse;margin-top:6px}
.gcard td{padding:3px 4px;border-top:1px solid rgba(255,255,255,.18)}
.gcard td.on{color:#FFE7A3;font-weight:700}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#1F1F1F;font-weight:600;font-size:15px;cursor:pointer}
.gbtn:disabled{opacity:.45;cursor:not-allowed}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0 2px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.alinks{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}
.alinks button{background:none;border:0;color:var(--rubric);font-size:14px;cursor:pointer;padding:4px 0}
.consents{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:14px}
.consents label{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 0}
.consents input{width:18px;height:18px;accent-color:var(--rubric)}
.consents .all{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px;font-size:15px}
.consents .crow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.consents .crow a{color:var(--muted);font-size:12.5px;white-space:nowrap}
.consents .cnote{color:var(--muted);font-size:12px;margin:6px 0 0;line-height:1.5}
.legal-links{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px}
.legal-links a{color:var(--muted)}
.acct-box{display:grid;gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.acct-box div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.acct-box small{color:var(--muted)}
.acct-btns{display:grid;gap:8px;margin-top:10px}
.acct-btns button{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer;text-align:left}
.danger{margin-top:14px;padding:10px 12px;border:1px solid color-mix(in srgb,#C0392B 35%,transparent);border-radius:12px;font-size:14px}
.danger summary{cursor:pointer;color:#C0392B;font-weight:700}
.danger input#aBye{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.danger button{margin-top:8px;width:100%;padding:11px;border-radius:10px;border:0;background:#C0392B;color:#fff;font-weight:700;cursor:pointer}
.danger label{display:flex;gap:8px;align-items:center;margin-top:6px}
.acct-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;margin-bottom:12px;background:color-mix(in srgb,var(--hb1,#3E5A92) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--hb1,#3E5A92) 22%,transparent)}
.acct-card span{display:grid;font-size:14px;min-width:0}
.acct-card b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-card small{color:var(--muted);font-size:12px}
.acct-card button{flex:0 0 auto;padding:9px 12px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--hb1,#3E5A92),var(--hb2,#C48A5A));color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
.btn.primary{background:var(--rubric);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45}
.acct-btn{position:absolute;top:14px;right:14px;z-index:3;display:flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 6px;border-radius:18px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.acct-btn .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);color:#2B2150;font-size:13px;font-weight:800;overflow:hidden}
.acct-btn .av img{width:100%;height:100%;object-fit:cover}
.acct-btn .av svg{width:16px;height:16px;fill:none;stroke:#2B2150;stroke-width:2}
.acct-btn.in{padding:0 4px;width:36px;justify-content:center}
.acct-btn:active{transform:scale(.95)}
.rk-open{margin-top:10px;width:100%;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer}
.pg-rank{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);font-size:15px;cursor:pointer;padding:0;align-self:center}
#pilsa .pg-rank{position:relative;z-index:41}
.rk-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
/* ---- 📖 성경읽기 도전방 ---- */
.rk-kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin:10px 0 4px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.rk-kinds button{padding:9px 4px;border-radius:10px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.rk-kinds button[aria-pressed=true]{background:linear-gradient(135deg,var(--hb1),var(--hb2));color:#fff;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--hb1) 60%,transparent)}
.rk-tabs[hidden]{display:none}
.rk-xp .rk-big{font-size:16px;font-weight:900;color:var(--hb1)}
.rk-go{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.rc-card{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.rc-card[hidden]{display:none}
.rc-card .rc-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font-size:22px;background:linear-gradient(135deg,var(--hb1),var(--hb2))}
.rc-card .rc-t{display:grid;gap:2px;min-width:0}.rc-card .rc-t small{font-size:12px;color:var(--muted);font-weight:600}.rc-card .rc-t b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rc-card .rc-sub{font-size:13px;color:var(--muted)}
.rc-card .rc-prog{display:block;height:6px;margin-top:4px;border-radius:99px;background:color-mix(in srgb,var(--hb1) 14%,transparent);overflow:hidden}.rc-card .rc-prog[hidden]{display:none}
.rc-card .rc-prog i,.rc-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--hb1),var(--hb2))}
.rc-card .rc-arr{font-size:22px;color:var(--muted)}
.rc-top{margin:12px 0 4px}.rc-new,.rc-read,.rc-joinb{width:100%;padding:13px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--hb1),var(--hb2));color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--hb1) 70%,transparent)}
.rc-room{display:grid;gap:6px;width:100%;margin-bottom:8px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.rc-room .rc-h,.rc-mycard .rc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.rc-room b{font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-st{flex:0 0 auto;font-style:normal;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--hb1) 14%,transparent);color:var(--hb1)}.rc-st.soon{background:#FFF1D6;color:#9A5B00}.rc-st.end{background:var(--line);color:var(--muted)}
.rc-m,.rc-me{font-size:12.5px;color:var(--muted);line-height:1.5}.rc-me{font-weight:700;color:var(--ink)}
.rc-bar{position:relative;display:block;height:8px;border-radius:99px;background:color-mix(in srgb,var(--hb1) 14%,transparent);overflow:visible}.rc-bar i{max-width:100%}.rc-bar.sm{height:5px;margin-top:4px}
.rc-bar em{position:absolute;top:-3px;width:2px;height:14px;margin-left:-1px;border-radius:2px;background:var(--ink);opacity:.55}
.rc-reader{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;padding:0 0 calc(30px + env(safe-area-inset-bottom,0px))}.rc-reader[hidden]{display:none}
.rr-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.rr-x{flex:0 0 40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer}
.rr-t{flex:1;min-width:0;display:grid}.rr-t small{font-size:12px;color:var(--hb1);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rr-t b{font-family:var(--ko);font-size:19px}
.rr-cnt{flex:0 0 auto;font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:99px;background:linear-gradient(135deg,var(--hb1),var(--hb2));color:#fff}
.rr-timer{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:1;max-width:680px;margin:10px auto 0;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--hb1) 10%,var(--bg));border:1px solid color-mix(in srgb,var(--hb1) 24%,transparent);margin-inline:14px}
@media (min-width:710px){.rr-timer{margin-inline:auto}}
.rr-timer.ok{background:color-mix(in srgb,#30A46C 12%,var(--bg));border-color:color-mix(in srgb,#30A46C 35%,transparent)}
.rr-bar{display:block;height:6px;border-radius:99px;background:color-mix(in srgb,var(--hb1) 15%,transparent);overflow:hidden}.rr-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--hb1),var(--hb2));transition:width 1s linear}.rr-timer.ok .rr-bar i{background:#30A46C}
.rr-msg{margin:8px 0 0;font-size:13.5px;line-height:1.55}.rr-msg b{font-variant-numeric:tabular-nums;color:var(--hb1)}.rr-msg small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rr-body{max-width:680px;margin:0 auto;padding:6px 18px 0}
.rr-v{margin:14px 0;font-family:var(--kofont,var(--ko));font-size:calc(18px*var(--koscale,1));line-height:1.85}.rr-v sup{font-family:var(--ui);font-size:11px;font-weight:700;color:var(--hb1);margin-right:6px}
.rr-foot{display:grid;gap:10px;margin-top:22px}
.rr-done{padding:15px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--hb1),var(--hb2));color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--hb1) 70%,transparent)}.rr-done:disabled{opacity:.55;cursor:default;box-shadow:none}
.rr-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rr-nav button{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}.rr-nav button:disabled{opacity:.4}
.rr-note{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6;text-align:center}
body.rr-open .tabbar,body.rr-open .mark-chip{display:none}
.rc-time{margin:14px 0 -4px;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.55;background:color-mix(in srgb,var(--hb1) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--hb1) 22%,transparent)}.rc-time[hidden]{display:none}.rc-time .rt-n{font-variant-numeric:tabular-nums;color:var(--hb1)}.rc-time.ok{background:color-mix(in srgb,#30A46C 12%,var(--surface));border-color:color-mix(in srgb,#30A46C 35%,transparent)}
.rc-rule{margin:8px 0 0;padding:9px 11px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);font-size:12.5px;line-height:1.6;color:var(--muted)}
.rc-intro{margin:6px 0 0;color:var(--muted);line-height:1.6}
.rc-info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.rc-info span{display:grid;gap:2px;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.rc-info small{font-size:11.5px;color:var(--muted)}.rc-info b{font-size:13px;line-height:1.4}
.rc-mycard,.rc-join{display:grid;gap:10px;margin-top:12px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--hb1) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--hb1) 22%,transparent)}
.rc-pct{font-weight:800;font-size:14px}.rc-pace{font-size:13px;color:var(--muted);line-height:1.5}
.rc-acts{display:grid;gap:8px;margin-top:14px}.rc-acts button{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}.rc-acts button.sure{background:#C0392B;color:#fff;border-color:#C0392B}.rc-rep{color:var(--muted)!important;font-size:13px!important}
.rc-custom{display:flex;align-items:center;gap:8px;margin-top:8px}.rc-custom select{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
#rcSheet .gr-lab input{width:100%;margin-top:6px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
#rcSheet .gr-lab{display:block;margin-top:12px;font-weight:700;font-size:14px}
.rc-sum{display:grid;gap:2px;margin:14px 0 10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--hb1) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--hb1) 22%,transparent)}.rc-sum small{color:var(--muted)}
.rc-note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:8px 0 0}
.rc-notes{width:100%;padding:11px;border-radius:12px;border:0;background:color-mix(in srgb,var(--hb1) 12%,var(--surface));color:var(--hb1);font:inherit;font-weight:800;cursor:pointer}

.rk-list li{display:grid;grid-template-columns:30px 40px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.rk-list li.me{border-color:var(--rubric);box-shadow:0 0 0 1px var(--rubric) inset;background:color-mix(in srgb,var(--rubric) 7%,var(--bg))}
.rk-list li:nth-child(-n+3){background:linear-gradient(135deg,color-mix(in srgb,#F2C14E 16%,var(--bg)),var(--bg))}
.rk-no{font-size:18px;font-weight:800;text-align:center;font-family:'Lora',serif}
.rk-who{display:grid;min-width:0}
.rk-who b{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-hon{color:#B8862E;font-weight:700;font-size:11.5px}
.rk-hon:empty{display:none}
.rk-lv{color:var(--muted);font-size:12px}

.lvup .lvflash{position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 50%,rgba(255,250,225,.95),rgba(255,240,200,0) 60%);animation:lvflash .9s ease-out forwards;pointer-events:none}
.lvup .lvburst{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;z-index:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(255,236,170,.85) 30%,rgba(255,210,120,.35) 55%,rgba(255,200,100,0) 72%);animation:lvburst 1.1s cubic-bezier(.15,.8,.3,1) forwards;pointer-events:none}
.lvup .lvrays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;z-index:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,236,170,.32) 0deg 5deg,rgba(255,236,170,0) 5deg 18deg);-webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 25%,transparent 55%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 25%,transparent 55%);animation:lvrays 1.2s ease-out forwards,lvspin 14s linear infinite;pointer-events:none}
.lvup .lvring{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;z-index:1;border-radius:50%;border:3px solid rgba(255,240,190,.9);box-shadow:0 0 24px rgba(255,220,140,.8),inset 0 0 18px rgba(255,220,140,.6);animation:lvring 1.1s ease-out forwards;pointer-events:none}
.lvup .lvring.r2{animation-delay:.18s;opacity:0}
.lvup.big .lvrays{background:repeating-conic-gradient(from 0deg,rgba(255,215,110,.42) 0deg 5deg,rgba(255,215,110,0) 5deg 15deg)}
.lvup.big .lvburst{width:60px;height:60px;margin:-30px 0 0 -30px}
.lvup .lvbox{animation:pop .5s .12s cubic-bezier(.2,1.4,.4,1) both}
@keyframes lvflash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@keyframes lvburst{0%{transform:scale(.2);opacity:1}100%{transform:scale(28);opacity:0}}
@keyframes lvrays{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:.55;transform:scale(1)}}
@keyframes lvspin{to{rotate:360deg}}
@keyframes lvring{0%{transform:scale(.3);opacity:1}100%{transform:scale(9);opacity:0}}
@media (prefers-reduced-motion:reduce){.lvup .lvrays,.lvup .lvburst,.lvup .lvring{animation:none;display:none}}

.en{font-family:var(--en);font-size:calc(18.5px*var(--fs,1));line-height:1.6;color:var(--ink)}
.size-btn{font-family:var(--ko);font-weight:700;font-size:13px;white-space:nowrap;letter-spacing:-.03em}
.en.miss,.ko.miss{color:var(--muted);font-style:italic;font-size:14px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.pager button{flex:1;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.pager button:disabled{opacity:.35;cursor:default}
.src{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.6}
@media (max-width:680px){
  .chap-head{display:none}
  .verse{grid-template-columns:1.8em 1fr;gap:4px 10px}
  .en{grid-column:2;font-size:calc(16.5px*var(--fs,1));color:var(--muted)}
  .ko{font-size:calc(17px*var(--fs,1)*var(--koscale,1))}
}
/* 보기 방식: 한글만 / 영어만 */
body.view-ko .verse .en, body.view-en .verse .ko, body.view-ko .quote .en, body.view-en .quote .ko{display:none}
body.view-ko .verse, body.view-en .verse{grid-template-columns:2.2em 1fr}
body.view-ko .chap-head, body.view-en .chap-head{display:none}
body.view-ko main, body.view-en main{max-width:760px}
body.view-en .verse .en{grid-column:2;color:var(--ink);font-size:calc(19px*var(--fs,1))}
@media (max-width:680px){ body.view-ko .verse, body.view-en .verse{grid-template-columns:1.8em 1fr} }
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg button{padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;line-height:1.3;word-break:keep-all}
.seg button[aria-pressed="true"]{background:var(--rubric);border-color:var(--rubric);color:#fff;font-weight:600}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px var(--shadow);max-height:86%;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{left:50%;width:640px;transform:translateX(-50%)}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-family:var(--ko);font-size:20px;margin:0 0 4px;text-wrap:balance}
.sheet .ref-en{font-family:var(--en);color:var(--muted);font-size:16px}
.quote{margin:14px 0;padding:12px 14px;border-left:3px solid var(--rubric);background:var(--bg);border-radius:0 8px 8px 0;display:grid;gap:8px}
.quote .ko,.quote .en{grid-column:auto}.quote .ko{font-size:calc(16px*var(--koscale,1))}.quote .en{font-size:16px;color:var(--muted)}
.links{display:grid;gap:8px}
.link{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.link:hover{border-color:var(--rubric)}
.link .tag{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em}
.tag.yt{background:#C4302B;color:#fff}
.tag.bh{background:var(--rubric-soft);color:var(--rubric)}
.tag.gg{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.link b{display:block;font-weight:600;font-size:15px}
.link small{color:var(--muted);font-size:12.5px}
.link::after{content:"↗";margin-left:auto;color:var(--muted)}
.tag.pk{background:var(--rubric);color:#fff}
.alt-bar{padding-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alt-bar .gae-link{grid-column:1/-1}
.mode-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
/* 스토리 모드 */
.story{position:fixed;inset:0;z-index:40;background:#0d0b14;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.story .sbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
.story .sbg.aurora{background:#0f0c1d;overflow:hidden}
.story .sbg.aurora i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;filter:blur(60px);opacity:.75;mix-blend-mode:screen;animation:aur 18s ease-in-out infinite alternate}
.story .sbg.aurora i:nth-child(1){background:#6C4FA8;left:-25vmax;top:-20vmax}
.story .sbg.aurora i:nth-child(2){background:#C76A5E;right:-30vmax;top:10vmax;animation-duration:22s;animation-delay:-6s}
.story .sbg.aurora i:nth-child(3){background:#2D6699;left:-10vmax;bottom:-35vmax;animation-duration:26s;animation-delay:-11s}
.story .sbg.aurora i:nth-child(4){background:#D9A441;right:-20vmax;bottom:-30vmax;width:50vmax;height:50vmax;opacity:.45;animation-duration:20s}
@keyframes aur{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12vmax,8vmax) scale(1.15)}100%{transform:translate(-6vmax,14vmax) scale(.95)}}
.story canvas.sfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.story .grain{position:absolute;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.story .stage{position:absolute;inset:0;display:grid;place-items:center;padding:96px 26px 150px;word-break:keep-all;text-align:center}
.story .stage .inner{max-width:560px;display:grid;gap:18px;width:100%}
.story .snum{font-family:var(--ui);font-size:13px;letter-spacing:.22em;font-weight:700;opacity:.75}
.story .kt{font-family:var(--kofont,var(--ko));font-size:calc(26px*var(--koscale,1));line-height:1.8;text-shadow:0 2px 18px rgba(0,0,0,.18)}
.story .et{font-family:var(--en);font-size:16.5px;line-height:1.6;opacity:.8}
.story .title-kt{font-size:calc(40px*var(--koscale,1));font-weight:700}
.story .hint2{font-size:14px;opacity:.8;line-height:1.7}
.story .w{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(4px);animation:wup .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes wup{to{opacity:1;transform:none;filter:none}}
.story .key{background-image:linear-gradient(transparent 52%,var(--hl,rgba(255,214,90,.75)) 52%,var(--hl,rgba(255,214,90,.75)) 82%,transparent 82%);background-repeat:no-repeat;background-size:0% 100%;animation:wup .55s cubic-bezier(.2,.8,.3,1) forwards,hl .7s ease-out forwards;padding:0 2px;border-radius:2px}
@keyframes hl{to{background-size:100% 100%}}
.story.paused .w,.story.paused .key{animation-play-state:paused}
.story-top{position:fixed;left:0;right:0;top:0;z-index:42;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:grid;gap:10px;pointer-events:none;background:linear-gradient(rgba(0,0,0,.28),transparent);transition:opacity .25s}
.story-top .segs{display:flex;gap:3px;height:3px}
.story-top .segs b{flex:1;border-radius:2px;background:rgba(255,255,255,.32);overflow:hidden;position:relative}
.story-top .segs b i{position:absolute;inset:0;width:0;background:#fff}
.story-top .segs b.done i{width:100%}
.story-top .segs b.cur i{animation:segfill var(--dur,6s) linear forwards}
.story.paused~.story-top .segs b.cur i,.story-top.paused .segs b.cur i{animation-play-state:paused}
@keyframes segfill{to{width:100%}}
.story-top .row2{display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.story-top .row2 span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-top button,.story-side button,.story-react button{pointer-events:auto;border:0;background:rgba(0,0,0,.24);color:#fff;width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center}
.story-side{position:fixed;right:12px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:42;display:grid;gap:10px;transition:opacity .25s}
.story-side button{width:46px;height:46px;font-size:19px}
.story-side button.on{background:#F6C64C;color:#3A2A00}
.story-side small{display:block;text-align:center;color:#fff;font-size:10.5px;margin-top:-6px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.story-react{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:42;display:flex;justify-content:center;gap:10px;transition:opacity .25s}
.story-react button{width:48px;height:48px;font-size:23px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.story-react button:active{transform:scale(.88)}
.story.hideui~.story-top,.story.hideui~.story-side,.story.hideui~.story-react{opacity:0}
.sfloat{position:fixed;z-index:43;pointer-events:none;font-size:30px;animation:sfl 1.8s ease-out forwards}
@keyframes sfl{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1;transform:translate(var(--dx1),-40px) scale(1.15)}100%{opacity:0;transform:translate(var(--dx2),-46vh) scale(.9) rotate(var(--rot))}}
.sheart{position:fixed;z-index:43;pointer-events:none;font-size:96px;transform:translate(-50%,-50%);animation:shrt .9s cubic-bezier(.2,1.4,.4,1) forwards;filter:drop-shadow(0 6px 20px rgba(255,120,150,.5))}
@keyframes shrt{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}45%{transform:translate(-50%,-50%) scale(.95)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
.story .endbox{display:grid;gap:12px;width:100%}
.story .endbox textarea{width:100%;min-height:96px;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:inherit;font:inherit;font-size:16px;line-height:1.6;resize:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.story .endbox textarea::placeholder{color:currentColor;opacity:.6}
.story .endbox button{padding:13px;border-radius:14px;border:0;background:rgba(255,255,255,.92);color:#2B2150;font-weight:700;font-size:15px;cursor:pointer}
.story .endbox button.ghost{background:rgba(255,255,255,.16);color:inherit;border:1px solid rgba(255,255,255,.3)}
.story .endbox .row3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bgpick{position:fixed;left:0;right:0;bottom:0;z-index:44;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(15,12,25,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px 18px 0 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.bgpick button{flex:0 0 auto;width:62px;height:96px;border-radius:12px;border:2px solid transparent;background-size:cover;background-position:center;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;text-shadow:0 1px 4px rgba(0,0,0,.7);cursor:pointer}
.bgpick button[aria-pressed=true]{border-color:#fff}
@media (prefers-reduced-motion:reduce){.story .sbg.aurora i,.story .grain{animation:none}.story .w,.story .key{animation-duration:.01s}}
.story-open .scrim{z-index:48}.story-open .sheet{z-index:49}.story-open .toast{z-index:50}
.pilsa{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.pilsa .ph{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.pilsa .ph h2{font-family:var(--ko);font-size:19px;margin:0;flex:1}
.pilsa .ph button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;color:var(--ink)}
.pilsa .pbar{max-width:640px;margin:10px auto 0;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pilsa .pbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.pilsa .pinfo{max-width:640px;margin:6px auto 0;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.pcard{max-width:640px;margin:16px auto 0;padding:22px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px var(--shadow)}
.pcard .pv{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--rubric)}
.ptext{margin-top:10px;font-family:var(--kofont,var(--ko));font-size:calc(22px*var(--koscale,1));line-height:1.9;word-break:keep-all}
.ptext span{color:var(--ink);opacity:.22;transition:opacity .15s,color .15s}
.ptext span.ok{opacity:1}
.ptext span.bad{opacity:1;color:#D1435B;text-decoration:underline wavy}
.ptext span.cur{opacity:.55;border-bottom:2px solid var(--rubric)}
.pin{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--kofont,var(--ko));font-size:calc(19px*var(--koscale,1));line-height:1.6;resize:none;min-height:96px}
.pin:focus{outline:none;border-color:var(--rubric)}
.pcard.done{border-color:var(--ok)}
.pdone{display:none;margin-top:10px;color:var(--ok);font-weight:700}
.pcard.done .pdone{display:block}
.pnav{max-width:640px;margin:14px auto 0;display:flex;gap:8px}
.pnav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink)}
.ptip{max-width:640px;margin:14px auto 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.slide.end .acts{display:grid;gap:10px;justify-items:center}
.slide.end .acts button{border:0;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.9);color:#2A2140;min-width:220px}
.listen-btn{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap}
body.tts-open main, body.tts-open .home{padding-bottom:180px}
.kara span{transition:color .12s}
.verse.reading .kara span{opacity:.5}
.verse.reading .kara span.sung{opacity:1;color:var(--rubric)}
.verse.reading{background:var(--hl);box-shadow:inset 3px 0 0 var(--ok)}
.font-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.font-grid button{display:grid;gap:4px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--ink)}
.font-grid button[aria-pressed="true"]{border-color:var(--rubric);box-shadow:inset 0 0 0 1px var(--rubric)}
.font-grid .fs{font-size:18px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-grid small{font-size:11.5px;color:var(--muted);font-family:var(--ui)}
.font-grid .cute{color:#D6487E;font-weight:700}
.card-canvas{width:100%;max-width:420px;aspect-ratio:4/5;display:block;margin:6px auto 0;border-radius:14px;box-shadow:0 8px 24px var(--shadow);background:var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{border-color:var(--rubric);background:var(--rubric);color:#fff}
.chips .bgchip{flex:0 0 auto;width:64px;height:80px;padding:0;border-radius:12px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden}
.chips .bgchip span{position:absolute;left:0;right:0;bottom:0;padding:3px 2px;font-size:10.5px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));text-align:center;white-space:nowrap}
.chips .bgchip[aria-pressed="true"]{box-shadow:0 0 0 3px var(--rubric);transform:translateY(-2px)}
.voice-list{display:grid;gap:6px}
.voice-row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.voice-row[aria-pressed="true"]{border-color:var(--rubric);box-shadow:inset 0 0 0 1px var(--rubric)}
.voice-row b{font-size:14.5px;display:block}
.voice-row small{color:var(--muted);font-size:12px}
.voice-row .pv{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-size:13px}
.voice-row .pv.loading{opacity:.6}
.marq{overflow:hidden;white-space:nowrap}
.marq>span{display:inline-block;animation:marq 8s ease-in-out infinite alternate}
@keyframes marq{0%,15%{transform:none}85%,100%{transform:translateX(var(--shift,0))}}
@media (prefers-reduced-motion:reduce){.marq{white-space:normal}.marq>span{animation:none}}
@media (max-width:440px){.gae-link small{display:none}}
.tts-load{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.tts-load{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.tts-bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:14;display:flex;justify-content:center;padding-inline:12px;pointer-events:none}
.tts-in{pointer-events:auto;display:flex;align-items:center;gap:8px;width:100%;max-width:560px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 6px 20px var(--shadow)}
.tts-in .now{flex:1;min-width:0;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tts-in .now small{display:block;opacity:.7;font-size:11.5px}
.tts-in button{flex:none;min-width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0 10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tts-in button{background:rgba(0,0,0,.12)}}
/* 아래 탭 (홈 / 성경) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{border:0;background:none;padding:8px 0 10px;display:grid;justify-items:center;gap:2px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabbar button[aria-current="page"]{color:var(--rubric)}
body:not(.tab-bible) .bar, body:not(.tab-bible) main{display:none}
body:not(.tab-home) #homeView{display:none}
body:not(.tab-notes) #notesView{display:none}
body:not(.tab-talk) #talkView{display:none}
/* 형광펜·메모 */
.hl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.sw-y{background:var(--mk-y)} .sw-g{background:var(--mk-g)} .sw-p{background:var(--mk-p)} .sw-b{background:var(--mk-b)}
.sw-clear{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:0 12px;height:36px;cursor:pointer;color:var(--muted);font-size:13px}
.note-box,.journal textarea{width:100%;margin-top:8px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--ko);font-size:16px;line-height:1.6;resize:vertical}
.saved{display:block;min-height:1.2em;margin-top:4px;font-size:12px;color:var(--muted)}
.xp-hint{display:block;margin-top:2px;font-size:11.5px;line-height:1.45;color:var(--muted);opacity:.72}
.xp-hint:empty{display:none}
.xp-tag{font-size:.78em;font-weight:500;opacity:.7;margin-left:4px}
/* AI 풀이 */
.ai-btn{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-weight:600;font-size:15px;color:var(--ink)}
.ai-btn .tag{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--ink);color:var(--bg)}
.ai-out{margin-top:8px;padding:14px;border-radius:12px;background:var(--bg);font-family:var(--ko);font-size:15.5px;line-height:1.75;white-space:pre-wrap}
.ai-out small{display:block;margin-top:8px;font-family:var(--ui);font-size:11.5px;color:var(--muted)}
/* 읽음 표시 */
.read-toggle{width:100%;margin-top:24px;padding:14px;border-radius:12px;border:1px dashed var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px;color:var(--ink)}
.read-toggle.done{border-style:solid;border-color:var(--ok);color:var(--ok)}
.chaps button.done{box-shadow:inset 0 -3px 0 var(--ok)}
/* 아침 말씀 노트 */
.journal{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.journal label{font-weight:600;font-size:14.5px}
/* 내 기록 */
.stat{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:grid;gap:10px}
.stat .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .big small{font-size:14px;color:var(--muted);font-weight:400;margin-left:4px}
.bar-track{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar-fill{height:100%;background:var(--ok);border-radius:4px}
.book-prog{display:grid;grid-template-columns:7em 1fr 4.5em;gap:10px;align-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.book-prog span:last-child{color:var(--muted);text-align:right}
.rec{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec-head button{border:0;background:none;padding:0;color:var(--rubric);font-weight:600;cursor:pointer;font-size:14px}
.rec-head small{color:var(--muted);font-size:12px}
.rec .vtext{font-family:var(--ko);font-size:15px;line-height:1.6;padding:6px 10px;border-radius:8px}
.rec .ntext{font-family:var(--ko);font-size:15px;line-height:1.6;white-space:pre-wrap}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.small-btn{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px}
/* 홈 */
.home{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.home>*,.sg-pane{min-width:0}
.home-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:6px}
.home-head h1{font-family:var(--ko);font-size:26px;margin:0}
.home-date{color:var(--muted);font-size:13px}
.home .sec{margin:10px 0 0}
.continue{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.continue b{font-family:var(--ko);font-size:17px;display:block}
.continue small{color:var(--muted);font-size:12.5px}
.continue .ct-main{flex:1;min-width:0}.ct-prog{display:flex;align-items:center;gap:10px;margin-top:8px}.ct-bar{flex:1;height:6px;border-radius:99px;background:color-mix(in srgb,var(--hb1) 14%,transparent);overflow:hidden}.ct-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--hb1),var(--hb2));transition:width .6s cubic-bezier(.2,.8,.2,1)}.ct-prog em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.continue::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted)}
.feature{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.player{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.player:empty{background:linear-gradient(135deg,#1d1a2e,#2c2742)}
.player:empty::after{content:'▶ 영상을 불러오는 중…';position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.7);font-size:14px;font-weight:600}
.player.pl-fail{aspect-ratio:auto;height:0;overflow:hidden}
.player.pl-fail::after{display:none}
.player img,.player iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.player button{position:absolute;inset:0;border:0;background:none;cursor:pointer;padding:0}
.player .play{position:absolute;left:50%;top:50%;width:64px;height:44px;margin:-22px 0 0 -32px;border-radius:12px;background:#C4302B;display:grid;place-items:center}
.player .play::after{content:"";border-style:solid;border-width:10px 0 10px 17px;border-color:transparent transparent transparent #fff;margin-left:4px}
.feature-body{padding:14px 16px 16px;display:grid;gap:8px}
.badge{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--rubric);background:var(--rubric-soft);padding:3px 8px;border-radius:999px}
.feature-body h3{margin:0;font-size:16.5px;line-height:1.45;text-wrap:balance}
.feature-body .meta{color:var(--muted);font-size:12.5px}
.read-btn{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;border:0;background:var(--rubric);color:#fff;font-weight:600;font-size:15px;cursor:pointer;text-align:left}
.read-btn::after{content:"›";margin-left:auto;font-size:20px}
.vlist{display:grid;gap:4px}
.vitem{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:start;padding:8px;margin-inline:-8px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;width:calc(100% + 16px)}
.vitem:hover,.vitem.now{background:var(--surface)}
.vitem img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--line)}
.vitem b{font-size:14px;line-height:1.4;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vitem small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.live-wrap{display:grid;gap:12px}
.live-card{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.live-card .feature-body{padding:12px 16px 14px;gap:6px}
.live-row{display:grid;grid-template-columns:128px 1fr;gap:12px;padding:12px;align-items:start}
.live-row .thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line);border:0;padding:0;cursor:pointer}
.live-row .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.live-row h3{margin:4px 0 0;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch-name{font-weight:700;font-size:15px}
.badge.live{background:#C4302B;color:#fff;display:inline-flex;align-items:center;gap:6px}
.badge.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
@media (prefers-reduced-motion:no-preference){.badge.live::before{animation:blink 1.4s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}}
.badge.soon{background:var(--hl);color:var(--ink)}
.badge.vod{background:var(--bg);color:var(--muted)}
.ch-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch-head a{font-size:12.5px;color:var(--muted);text-decoration:none}
.jubo-card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.jubo-card img{width:96px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--line);display:block}
.jubo-card b{font-size:16px;display:block}
.jubo-card small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.jubo-card .go{margin-top:8px;display:inline-block;font-weight:600;color:var(--rubric);font-size:14px}
#juboSheet{max-height:94%}
.jubo-pages{display:grid;gap:10px;margin-top:10px}
.jubo-page{position:relative;min-height:120px;border-radius:8px;border:1px solid var(--line);background:var(--bg);overflow:hidden}
.jubo-page img{position:relative;z-index:1;width:100%;display:block} /* 숨겼다 보이기 없이 그대로 그려요 (안드로이드 흰 화면 방지) */
.jubo-page .jp-load{position:absolute;inset:0;z-index:0}
.jubo-page.ok{min-height:0;background:#fff}
.jubo-page.ok .jp-load{display:none}
.jp-load{display:block;padding:44px 12px;text-align:center;color:var(--muted);font-size:13.5px}
.jubo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.jubo-actions a{flex:1;min-width:140px;text-align:center;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
/* 홈 배경: 시간대 빛이 은은하게 번지는 배경 + 반투명 유리 카드 */
:root{--glass:rgba(255,255,255,.66);--glass-line:rgba(255,255,255,.85);--blob-op:.8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(30,34,40,.62);--glass-line:rgba(255,255,255,.08);--blob-op:.36}}
:root[data-theme="dark"]{--glass:rgba(30,34,40,.62);--glass-line:rgba(255,255,255,.08);--blob-op:.36}
body{--a1:#9EC1F0;--a2:#F6D49A;--a3:#C9B8F2}
body[data-t="dawn"]{--a1:#B98AC7;--a2:#F2A27E;--a3:#8EA6E0}
body[data-t="day"]{--a1:#9FD0F0;--a2:#B9E4D6;--a3:#D5CCF7}
body[data-t="evening"]{--a1:#E7A1A8;--a2:#F2B07E;--a3:#B58BC9}
body[data-t="night"]{--a1:#6E7FC7;--a2:#8B6FB8;--a3:#4C6FA6}
body{--hb1:#3E5A92;--hb2:#C48A5A}
body[data-t="dawn"]{--hb1:#5A3E7A;--hb2:#C76A5E}
body[data-t="day"]{--hb1:#2D6699;--hb2:#3FA0A8}
body[data-t="evening"]{--hb1:#8A3A57;--hb2:#D9783F}
body[data-t="night"]{--hb1:#2C3A78;--hb2:#6C4FA8}
/* 위쪽 버튼: 시간대 색이 들어간 트렌디한 버튼 */
.bar .icon-btn{border:0;transition:transform .15s ease,box-shadow .2s ease}
.bar .icon-btn:active{transform:scale(.92)}
#prevBtn,#nextBtn{background:linear-gradient(135deg,var(--hb1),var(--hb2));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--hb1) 35%,transparent)}
#prevBtn svg,#nextBtn svg{stroke-width:2.4}
#searchBtn,#viewBtn{background:color-mix(in srgb,var(--hb1) 14%,var(--surface));color:var(--hb1);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hb1) 22%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #searchBtn,:root:not([data-theme="light"]) #viewBtn{background:color-mix(in srgb,var(--hb2) 22%,var(--surface));color:color-mix(in srgb,var(--hb2) 70%,#fff)}}
:root[data-theme="dark"] #searchBtn,:root[data-theme="dark"] #viewBtn{background:color-mix(in srgb,var(--hb2) 22%,var(--surface));color:color-mix(in srgb,var(--hb2) 70%,#fff)}
#prevBtn:disabled,#nextBtn:disabled{opacity:.35;box-shadow:none}
.listen-btn{background:linear-gradient(135deg,var(--hb1),var(--hb2));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--hb1) 30%,transparent)}
.mode-btn{background:color-mix(in srgb,var(--hb1) 9%,var(--surface));border-color:color-mix(in srgb,var(--hb1) 20%,transparent)}
.home-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bg);overflow:hidden}
.home-bg::before,.home-bg::after,.home-bg i{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:var(--blob-op)}
.home-bg::before{width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle,var(--a1),transparent 65%)}
.home-bg::after{width:65vmax;height:65vmax;right:-25vmax;top:25vh;background:radial-gradient(circle,var(--a2),transparent 65%)}
.home-bg i{width:60vmax;height:60vmax;left:-10vmax;bottom:-30vmax;background:radial-gradient(circle,var(--a3),transparent 65%)}
@media (prefers-reduced-motion:no-preference){.home-bg::before{animation:drift1 26s ease-in-out infinite alternate}.home-bg::after{animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(8vmax,6vmax)}}@keyframes drift2{to{transform:translate(-6vmax,-8vmax)}}}
.home .continue,.home .live-card,.home .jubo-card,.home .feature,.home .journal{background:var(--glass);border-color:var(--glass-line);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 4px 18px rgba(30,30,60,.06)}
.home .journal textarea{background:rgba(255,255,255,.55)}
body.tab-home .tabbar{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top-color:var(--glass-line)}
/* ---- 아래 탭: 떠 있는 유리 막대 + 선택된 탭은 시간대 색 알약 ---- */
.tabbar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;padding:6px;gap:4px;border-radius:26px;border:1px solid var(--glass-line);background:var(--glass);background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 10px 30px -6px rgba(20,25,45,.28),0 2px 6px rgba(20,25,45,.08)}
body.tab-home .tabbar{border:1px solid var(--glass-line);background:color-mix(in srgb,var(--surface) 72%,transparent)}
.tabbar button{position:relative;isolation:isolate;padding:7px 0 6px;border-radius:20px;gap:3px;font-size:11.5px;letter-spacing:-.2px;color:var(--muted);transition:color .25s,transform .15s;-webkit-tap-highlight-color:transparent}
.tabbar button::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,var(--hb1),var(--hb2));opacity:0;transform:scale(.7);transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.5,1);z-index:-1;box-shadow:0 6px 16px -4px color-mix(in srgb,var(--hb1) 70%,transparent)}
.tabbar button:active{transform:scale(.94)}
.tabbar svg{width:23px;height:23px;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.tabbar button[aria-current="page"]{color:#fff;font-weight:800}
.tabbar button[aria-current="page"]::before{opacity:1;transform:scale(1)}
.tabbar button[aria-current="page"] svg{transform:translateY(-1px) scale(1.06);stroke-width:2.2}
@media (prefers-reduced-motion:reduce){.tabbar button::before,.tabbar svg{transition:none}}
/* ===== 앱 전체 꾸미기 (2026-10-06): 은은한 색 배경 · 유리 카드 · 부드러운 전환 ===== */
body.tab-bible .home-bg::before,body.tab-bible .home-bg::after,body.tab-bible .home-bg i{opacity:calc(var(--blob-op) * .4)}
body.tab-talk .home-bg::after,body.tab-notes .home-bg::after{opacity:calc(var(--blob-op) * .75)}
.bar{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom-color:color-mix(in srgb,var(--line) 60%,transparent)}
/* 화면 제목: 시간대 색 글씨 + 작은 알약 부제 */
.home-head{align-items:center;padding-top:10px}
.home-head h1{font-size:30px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(120deg,var(--hb1),var(--hb2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .home-head h1{background-image:linear-gradient(120deg,#fff,color-mix(in srgb,var(--a1) 55%,#fff))}}
:root[data-theme="dark"] .home-head h1{background-image:linear-gradient(120deg,#fff,color-mix(in srgb,var(--a1) 55%,#fff))}
.home-head .home-date{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* 카드: 유리처럼 비치는 바탕 + 부드러운 그림자 */
#talkView .sg-tabs,#talkView .g-card,#talkView .tk-favs,#talkView .tk-tools button,#talkView .tk-soon,#talkView .tk-acts button:not(.tk-next),#talkView .tk-chips button:not([aria-pressed="true"]),#talkView .gbtn:not(.primary),
#notesView .stat,#notesView .acct-card,#notesView>details,#notesView .note,#notesView .tk-favs{background:var(--glass);border-color:var(--glass-line);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 4px 18px rgba(30,30,60,.07)}
#talkView .g-card,#notesView .stat{border-radius:22px}
/* 누를 때 살짝 눌리는 반응 */
.gbtn,.tk-tools button,.tk-acts button,.sg-tabs button,.tk-chips button,.pl-card,.continue,.pray-card,.feature,.acct-card button,.rk-open{transition:transform .14s ease,box-shadow .2s ease,background-color .2s}
.gbtn:active,.tk-tools button:active,.tk-acts button:active,.sg-tabs button:active,.tk-chips button:active,.continue:active,.pray-card:active,.feature:active,.acct-card button:active,.rk-open:active{transform:scale(.97)}
/* 화면 전환: 탭·소그룹 칸을 바꿀 때 아래에서 살짝 떠오르며 나타나요 */
@media (prefers-reduced-motion:no-preference){
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.tab-home #homeView,body.tab-talk #talkView,body.tab-notes #notesView,body.tab-bible main{animation:viewIn .38s cubic-bezier(.2,.8,.2,1) both}
.sg-pane:not([hidden]){animation:viewIn .3s cubic-bezier(.2,.8,.2,1) both}
.home>*{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) both}
.home>*:nth-child(2){animation-delay:.04s}.home>*:nth-child(3){animation-delay:.08s}.home>*:nth-child(4){animation-delay:.12s}.home>*:nth-child(5){animation-delay:.16s}.home>*:nth-child(n+6){animation-delay:.2s}
}
.tts-bar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.pol-note{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .home .journal textarea{background:rgba(0,0,0,.2)}}
/* 홈 머리: 스테인드글라스 창으로 들어오는 시간대별 빛 */
.hero{word-break:keep-all;position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 20px;color:#fff;min-height:250px;display:grid;align-content:space-between;gap:18px;
  background:linear-gradient(160deg,var(--h1),var(--h2) 55%,var(--h3));box-shadow:0 10px 30px rgba(20,15,30,.18);isolation:isolate}
.hero[data-t="dawn"]{--h1:#2E2350;--h2:#8C4A63;--h3:#E39A6A}
.hero[data-t="morning"]{--h1:#2B3F6E;--h2:#5E7FB5;--h3:#EBC07D}
.hero[data-t="day"]{--h1:#1F4A73;--h2:#3B78A8;--h3:#93BEDC}
.hero[data-t="evening"]{--h1:#341F45;--h2:#86384A;--h3:#D9824F}

.hero::before{content:"";position:absolute;inset:-20% -10% auto auto;width:85%;height:140%;z-index:-1;pointer-events:none;
  background:repeating-linear-gradient(115deg,rgba(255,240,200,.13) 0 26px,transparent 26px 64px);transform:rotate(-8deg);
  -webkit-mask-image:linear-gradient(200deg,#000 10%,transparent 70%);mask-image:linear-gradient(200deg,#000 10%,transparent 70%)}
.hero .glass{position:absolute;top:-6px;right:-4px;width:132px;height:auto;z-index:-1;opacity:.62;filter:drop-shadow(0 0 18px rgba(255,220,150,.35))}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-right:96px}
.hero-top .app{font-family:'Lora',var(--en);font-weight:600;line-height:1;display:grid;justify-items:start;gap:4px}
.hero-top .app .z{font-size:30px;letter-spacing:.04em;color:#FCF2DC}

const GEO={on:false,lat:null,lng:null,obs:null,max:Number(LS.get('geomax',0))||0}; // max: 0이면 전체, 아니면 그 거리(m) 안만

function geoRngPaint(){ document.querySelectorAll('.geo-rng').forEach(R=>{ R.hidden=!GEO.on; R.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===GEO.max)); }); }
function geoM(a,b,c,d){ const R=6371000, r=x=>x*Math.PI/180, dl=r(c-a), dn=r(d-b); const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

function geoStop(){ GEO.on=false; GEO.lat=GEO.lng=null; document.querySelectorAll('.pl-card.geo-far').forEach(c=>c.classList.remove('geo-far')); document.querySelectorAll('.geo-none').forEach(e=>e.remove()); document.querySelectorAll('.pl-card').forEach(c=>{ delete c.dataset.lk; delete c.dataset.nf; }); document.querySelectorAll('.pl-dist.me').forEach(e=>e.remove()); document.querySelectorAll('.geo-tg').forEach(geoBtnPaint); }

  b.onclick=async()=>{ if(GEO.on){ geoStop(); return; } b.textContent='위치 확인 중…'; const ok=await geoStart(); document.querySelectorAll('.geo-tg').forEach(geoBtnPaint); if(ok){ geoWatch(); geoPaint(); toast('📏 가게까지 거리를 보여 줄게요'); document.querySelectorAll('.geo-wrap.in-res').forEach(e=>e.remove()); } };

function cardGeo(card,o){ if(o.x&&o.y){ card.dataset.x=o.x; card.dataset.y=o.y; } else if(o.q) card.dataset.q=o.q; }
// 가게 이름으로 좌표 찾기: 동네+이름 → 지역+이름 → 이름만 순서로 시도하고, 이름이 비슷한 결과를 골라요 (내 위치는 보내지 않아요)
const nameKey=x=>String(x||'').replace(/\s|점$|본점$|직영점$/g,'').toLowerCase();
async function cardXY(card){ if(card.dataset.x) return true; if(!card.dataset.q||card.dataset.lk) return false; card.dataset.lk='1';
  const qs=[card.dataset.q, ...(card.dataset.q2?[card.dataset.q2]:[]), card.dataset.nm||''].filter((v,i,a)=>v&&v.length>=2&&a.indexOf(v)===i);
  const want=nameKey(card.dataset.nm||card.dataset.q.split(' ').slice(-2).join(''));
  for(const q of qs){ const j=await liveGet('kakao',q,'any',1); if(j.error) break; const its=j.items||[];
    const it=its.find(i=>{ const k=nameKey(i.name); return k&&(k.includes(want.slice(0,4))||want.includes(k.slice(0,4))); })||(q===qs[0]?its[0]:null);
    if(it&&it.x){ card.dataset.x=it.x; card.dataset.y=it.y; return true; } }
  card.dataset.nf='1'; return false; }
function geoNote(card,t){ if(card.closest('.pl-near')) return; let el=card.querySelector(':scope > .pl-dist.me'); if(!el){ el=document.createElement('p'); el.className='pl-dist me wait'; const top=card.querySelector(':scope > .pl-top'); (top||card.firstChild).after(el); } el.textContent=t; }
function geoBadge(card){ const x=+card.dataset.x, y=+card.dataset.y; if(!x||!GEO.on) return; const m=geoM(GEO.lat,GEO.lng,y,x); card.dataset.d=Math.round(m);
  let el=card.querySelector(':scope > .pl-dist.me'); if(!el){ el=document.createElement('p'); el.className='pl-dist me'; const top=card.querySelector(':scope > .pl-top'); (top||card.firstChild).after(el); } el.classList.remove('wait'); el.textContent='📍 내 위치에서 '+geoFmt(m); }
let geoT=0;
function geoPaint(){ clearTimeout(geoT); geoT=setTimeout(async()=>{ if(!GEO.on) return; const cards=[...document.querySelectorAll('#sgFood .pl-card, #sgCafe .pl-card')].filter(c=>!c.closest('.pl-near'));
  await Promise.all(cards.map(async c=>{ if(!c.dataset.x&&!c.dataset.nf) geoNote(c,'📍 거리 계산 중…'); if(await cardXY(c)) geoBadge(c); else if(c.dataset.nf) geoNote(c,'📍 거리 정보를 찾지 못했어요 · 지도에서 확인해 주세요'); }));

    const dv=c=>c.dataset.d===undefined?1e9:+c.dataset.d; const sorted=cs.slice().sort((a,b)=>dv(a)-dv(b)); if(!sorted.every((c,i)=>c===cs[i])){ const anchor=cs[cs.length-1].nextSibling; sorted.forEach(c=>L.insertBefore(c,anchor)); } });

    cs.forEach(c=>{ const far=!!GEO.max&&(c.dataset.d===undefined?!!(c.dataset.nf||c.dataset.x):+c.dataset.d>GEO.max); c.classList.toggle('geo-far',far); if(!far) shown++; });

function grTimerHTML(){ return '<div class="gr-timer"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="bg"/><circle cx="50" cy="50" r="44" class="fg" pathLength="100"/></svg><b>-</b></div>'; }
function grTick(){
  const s=GR.st; if(!s) return; const left=grLeft();
  document.querySelectorAll('.gr-timer').forEach(el=>{ const T=el.querySelector('b'), fg=el.querySelector('.fg'); if(left==null){ T.textContent='∞'; return; }
    const total=Number(el.dataset.total)||Math.max(1,left); const l=Math.max(0,Math.ceil(left));
    T.textContent=l<=0?'끝!':(l>=60?Math.floor(l/60)+':'+String(l%60).padStart(2,'0'):l); fg.style.strokeDasharray=(Math.min(1,Math.max(0,left)/total)*100)+' 100';

    const talky=(s.game==='mafia'&&s.phase==='day')||(s.game==='liar'&&s.phase==='talk');
    if(talky&&left<=30&&left>29&&!GR.pip[k]){ GR.pip[k]=1; gaPip(); }
    if(talky&&left<=0&&left>-5&&!GR.alarm[k]){ GR.alarm[k]=1; gaAlarm(); }

// 방장 폰이 자동으로 다음 단계로 넘겨요 (같은 단계는 한 번만)
function grOnce(k,fn){ if(GR.done[k]) return; GR.done[k]=1; fn(); }
function grAuto(){
  const s=GR.st; if(!s||!grIsHost()||!s.game) return; const left=grLeft(), d=s.pub&&s.pub.day, k=[s.game,s.phase,s.step,d,s.pub&&s.pub.n].join(':');
  const all=pool=>pool.length>0&&pool.every(p=>p.acted);
  if(s.game==='ox'&&s.phase==='q'&&(all(s.players.filter(p=>p.online))||(left!=null&&left<-0.5))) grOnce(k,()=>grHost('reveal'));
  if(s.game==='liar'&&s.phase==='vote'&&all(s.players)) grOnce(k,()=>grHost('reveal'));
  if(s.game==='vote'&&s.phase==='vote'&&all(s.players)) grOnce(k,()=>setTimeout(()=>grHost('close'),1500));
  if(s.game==='liar'&&s.phase==='guess'&&left!=null&&left<-1) grOnce(k,()=>grHost('skipguess'));
  if(s.game==='mafia'){
    const auto=s.opts.mode==='auto';
    if(auto&&s.phase==='night'&&s.x&&s.x.ready) grOnce(k,()=>grHost('next'));
    if(auto&&s.phase==='day'&&left!=null&&left<-3) grOnce(k,()=>grHost('vote'));
    if(s.phase==='vote'&&all(s.players.filter(p=>p.alive&&p.role!=='mod'))) grOnce(k,()=>setTimeout(()=>grHost('tally'),1200));
  }
}

async function grStartGame(){

    return grDo('gr_start',{p_game:'liar',p_opts:{words,liars:o.liars,talk:o.talk,cat:o.cat}}); }
  if(set.game==='ox'){ GR.deck=gShuf(GD.ox); return grDo('gr_start',{p_game:'ox',p_opts:set.ox}); }

  if(set.game==='code'){ if(GR.st.players.length<4) return toast('말씀 암호는 4명 이상이 함께해요'); return grDo('bg_start',{p_game:'code',p_opts:{words:gShuf(GD.codewords||[]).slice(0,60)}}); }
  if(set.game==='ask'){ if(GR.st.players.length<2) return toast('익명 질문은 2명 이상이 함께해요'); return grDo('bg_start',{p_game:'ask',p_opts:{}}); }
  if(set.game==='king'){ const n=GR.st.players.length; if(n<3||n>8) return toast('왕좌 카드는 3~8명이 함께해요'); return grDo('bg_start',{p_game:'king',p_opts:set.king}); }

}

// ---- 라이어 ----
function grSecret(html,cls){ const k='sec'+GR.st.game+(GR.st.pub.day||'')+GR.st.phase; const open=!!GR.view[k];
  const w=document.createElement('button'); w.type='button'; w.className='gr-secret '+(cls||'')+(open?' open':''); w.innerHTML=open?html+'<small>👆 다시 누르면 가려져요</small>':'<b>👀 눌러서 내 '+(GR.st.game==='mafia'?'역할':'제시어')+'보기</b><small>옆 사람이 못 보게 조심!</small>';
  w.onclick=()=>{ GR.view[k]=!open; GR.skey=''; grRender(); }; return w; }
function grPickGrid(list,sel,onPick,mark){ const g=document.createElement('div'); g.className='mf-pick gr-pick';
  list.forEach(p=>{ const b=document.createElement('button'); b.type='button'; if(p.pid===sel) b.classList.add('on'); b.innerHTML='<b>'+p.pid+'</b><small>'+grEsc(p.name)+'</small>'+(mark?'<i>'+mark(p)+'</i>':''); b.onclick=()=>{ gBuzz(15); g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); onPick(p.pid); }; g.appendChild(b); }); return g; }
function grLiar(M){
  const s=GR.st, pub=s.pub, host=grIsHost(), me=s.me, liar=me.role==='liar';
  if(s.phase==='talk'){ M.innerHTML='';
    M.appendChild(grSecret(liar?'<span class="gr-sec-t">당신은</span><b class="gr-sec-w">라이어 🤫</b><span>주제: '+grEsc(me.priv.cat)+'</span><p>제시어를 모르는 걸 들키지 마세요! 다른 사람 설명을 잘 듣고 맞혀 보세요.</p>':'<span class="gr-sec-t">주제: '+grEsc(me.priv.cat)+'</span><b class="gr-sec-w">'+grEsc(me.priv.word)+'</b><p>라이어에게 들키지 않게, 너무 쉽게 설명하지 마세요!</p>',liar?'liar':''));
    M.insertAdjacentHTML('beforeend','<div class="g-card center"><p class="g-desc"><b>'+grEsc(grNm(pub.first))+'</b>님부터 시계 방향으로<br>제시어를 <b>한마디씩</b> 설명해요 (두 바퀴)</p>'+(s.deadline?grTimerHTML():'')+'</div>');
    if(s.deadline) M.querySelector('.gr-timer').dataset.total=s.opts.talk*60;
    if(host){ M.appendChild(gBtn('🗳️ 투표 시작','primary',()=>grHost('vote'))); if(s.deadline) M.appendChild(gBtn('+30초','',()=>grHost('addtime'))); } else grWaitHost(M,'설명이 끝나면 방장이 투표를 시작해요'); return; }
  if(s.phase==='vote'){ const sel=me.act&&me.act.t;
    M.innerHTML='<div class="mf-stage"><small>🗳️ 투표</small><div class="mf-script">라이어라고 생각하는 사람을 골라 주세요<br><span class="g-sub">투표가 끝나기 전까지는 바꿀 수 있어요</span></div></div>';
    M.appendChild(grPickGrid(s.players.filter(p=>p.pid!==me.pid),sel,t=>grAct({t})));
    M.insertAdjacentHTML('beforeend','<p class="gr-prog g-sub center-t" data-label="투표한 사람"></p>');
    if(host) M.appendChild(gBtn('개표하기','',()=>grHost('reveal'))); return; }
  const tallyHTML=()=>{ const v=pub.votes||{}; const cnt={}; Object.values(v).forEach(t=>cnt[t]=(cnt[t]||0)+1); return '<div class="gr-votes">'+Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([t,c])=>'<span><b>'+grEsc(grNm(+t))+'</b> '+'🗳️'.repeat(c)+'</span>').join('')+'</div>'; };
  if(s.phase==='guess'){ const meCaught=liar&&pub.top===me.pid;
    M.innerHTML='<div class="g-reveal liar"><small>지목된 사람은…</small><div class="g-word">'+grEsc(grNm(pub.top))+'</div><p>진짜 라이어였어요! 😱<br>하지만 제시어를 맞히면 <b>라이어 역전승</b>이에요</p></div>'+tallyHTML()+grTimerHTML();
    M.querySelector('.gr-timer').dataset.total=60;
    if(meCaught){ const w=document.createElement('div'); w.className='g-card'; w.innerHTML='<h3>제시어가 뭘까요?</h3><div class="gr-join"><input id="grGuess" maxlength="30" placeholder="제시어를 적어 주세요"><button type="button" class="gbtn primary" id="grGuessBtn">맞히기</button></div>'; M.appendChild(w);
      const I=$('grGuess'); I.value=GR.view.guess||''; I.oninput=()=>GR.view.guess=I.value; $('grGuessBtn').onclick=()=>{ const g=I.value.trim(); if(!g) return toast('제시어를 적어 주세요'); I.blur(); grAct({guess:g}); }; }
    else M.insertAdjacentHTML('beforeend','<p class="g-sub center-t">라이어가 제시어를 맞히는 중이에요… 🤔</p>');
    if(host&&!meCaught) M.appendChild(gBtn('건너뛰기 (시민 승리)','ghost',()=>grHost('skipguess'))); return; }
  if(s.phase==='end'){ const lw=pub.winner==='liar'; const iWin=(liar&&lw)||(!liar&&!lw); if(!GR.view.lend){ GR.view.lend=1; iWin?gaFanfare():gBuzz(200); }
    const ls=(pub.liars||[]).map(grNm).join(', ');
    M.innerHTML='<div class="g-reveal big '+(lw?'liar':'')+'"><small>'+(iWin?'🎉 우리 팀 승리!':'😢 아쉬워요')+'</small><div class="g-word">'+(lw?'🕵️ 라이어 승리!':'🙂 시민 승리!')+'</div><p>제시어는 「'+grEsc(pub.word)+'」<br>라이어: '+grEsc(ls)+(pub.guess?'<br>라이어의 답: 「'+grEsc(pub.guess)+'」':'')+(pub.top==null?'<br>표가 갈려서 라이어를 못 찾았어요':(!pub.caught?'<br>'+grEsc(grNm(pub.top))+'님은 라이어가 아니었어요!':''))+'</p></div>'+tallyHTML();
    grEndBtns(M); }
}

// ---- 마피아 ----
function grMafScript(s){
  const mod=s.opts.mode==='mod', st=s.step, pub=s.pub, hasDoc=s.opts.doc>0, hasPol=s.opts.pol>0;
  const how=mod?'손가락으로 가리켜 주세요':'폰에서 골라 주세요';
  if(s.phase==='night'){
    if(st===0) return '밤이 되었습니다. 모두 고개를 숙이고 눈을 감아 주세요.';
    if(st===1) return '마피아는 눈을 뜨세요.'+(pub.day===1?' 서로 얼굴을 확인하고,':'')+' 오늘 밤 제거할 사람을 '+how+'.';
    if(st===2) return '마피아는 눈을 감아 주세요. 의사는 눈을 뜨고, 살릴 사람을 '+how+'.';
    if(st===3) return (hasDoc?'의사는':'마피아는')+' 눈을 감아 주세요. 경찰은 눈을 뜨고, 조사할 사람을 '+how+'.';
  }
  if(s.phase==='day'){ const n=pub.news||{}; const last=hasPol?'경찰은':hasDoc?'의사는':'마피아는';
    return last+' 눈을 감아 주세요. 아침이 되었습니다. 모두 눈을 떠 주세요. '+(n.k==='kill'?'지난밤 '+grNm(n.pid)+'님이 마피아에게 당했습니다.':n.k==='saved'?'마피아의 공격이 있었지만, 의사의 활약으로 아무도 죽지 않았습니다.':'아무 일도 없는 조용한 밤이었습니다.')+(s.phase==='day'?' 지금부터 토론을 시작해 주세요.':''); }
  if(s.phase==='vote') return '투표를 시작합니다. 마피아라고 생각하는 사람에게 투표해 주세요.';
  if(s.phase==='voted'){ const o=pub.vote&&pub.vote.out; return o?'투표 결과, '+grNm(o)+'님이 탈락했습니다.':'표가 갈려서 아무도 탈락하지 않았습니다.'; }
  if(s.phase==='end') return pub.winner==='cit'?'게임이 끝났습니다. 시민 팀의 승리입니다!':'게임이 끝났습니다. 마피아 팀의 승리입니다!';
  return '';
}
function grRoleTable(){ const s=GR.st; return '<div class="mf-table">'+s.players.filter(p=>p.role&&p.role!=='mod').map(p=>'<span class="mf-p r-'+p.role+(p.alive?'':' dead')+'"><b>'+p.pid+'번 '+grEsc(p.name)+'</b>'+ROLE[p.role][0]+' '+ROLE[p.role][1]+'</span>').join('')+'</div>'; }
function grMafia(M){
  const s=GR.st, pub=s.pub, me=s.me, host=grIsHost(), mod=me.role==='mod', auto=s.opts.mode==='auto', R=ROLE[me.role]||ROLE.cit;
  const alive=s.players.filter(p=>p.alive&&p.role!=='mod'), ghost=!me.alive&&!mod&&me.role;
  const speakKey=[pub.day,s.phase,s.step].join(':');
  if((auto&&host)||(mod&&LS.get('grtts',true))) grSay(speakKey,grMafScript(s));
  const top=document.createElement('div'); top.className='mf-top'; top.innerHTML='<span>'+(pub.day?'🌙 '+pub.day+'일차':'역할 확인')+' · 생존 '+alive.length+'명</span>'+(mod?'<button type="button" class="mf-tbtn" id="grTts">🔊 읽어 주기 '+(LS.get('grtts',true)?'켬':'끔')+'</button>':'<span>'+R[0]+' '+R[1]+(ghost?' 👻':'')+'</span>'); M.appendChild(top);
  if(mod) $('grTts').onclick=()=>{ LS.set('grtts',!LS.get('grtts',true)); GR.skey=''; grRender(); };
  if(mod||ghost){ M.insertAdjacentHTML('beforeend',(ghost?'<div class="gr-ghost">👻 유령 모드 · 말하지 말고 지켜봐 주세요. 모든 역할이 보여요</div>':'')+grRoleTable()); }
  const stage=(title,html)=>M.insertAdjacentHTML('beforeend','<div class="mf-stage"><small>'+title+'</small><div class="mf-script">'+html+'</div></div>');
  const myChecks=(me.priv.checks||[]).filter(c=>c.day===pub.day);
  const checkHTML=c=>'<div class="mf-res '+(c.maf?'yes':'no')+'">🔎 '+grEsc(grNm(c.pid))+'님은 마피아가 '+(c.maf?'<b>맞아요!</b>':'<b>아니에요</b>')+'</div>';

  if(s.phase==='roles'){
    if(!mod){ let html='<span class="gr-sec-t">나의 역할</span><b class="gr-sec-w">'+R[0]+' '+R[1]+'</b><p>'+R[2]+'</p>';
      if(me.role==='maf'){ const team=s.players.filter(p=>p.role==='maf'&&p.pid!==me.pid); html+='<p class="gr-team">'+(team.length?'🤝 같은 편 마피아: '+team.map(p=>grEsc(grNm(p.pid))).join(', '):'혼자서 해내야 해요!')+'</p>'; }
      M.appendChild(grSecret(html,'r-'+me.role)); }
    stage('역할 확인','모두 자기 역할을 확인했으면 '+(host?'아래 버튼을 눌러':'방장이')+' 밤을 시작해요.<br><span class="g-sub">'+(auto?'🔊 방장 폰이 목소리로 진행해요. 소리를 켜 주세요!':'🎙️ 진행자가 진행해요.')+'</span>');
    if(host) M.appendChild(gBtn('🌙 밤 시작','primary',()=>grHost('night'))); return; }

  if(s.phase==='night'){
    const titles=['🌙 밤','🔪 마피아 차례','💉 의사 차례','🚓 경찰 차례'];
    if(mod){ const sec=(s.x&&s.x.sec)||{};
      stage(titles[s.step],'“'+grMafScript(s)+'”');
      if(s.step>=1){ const key=['','kill','save','checked'][s.step]; const cur=sec[key];
        const roleAlive=r=>alive.some(p=>p.role===r); const r=['','maf','doc','pol'][s.step];
        if(!roleAlive(r)) M.insertAdjacentHTML('beforeend','<p class="g-sub center-t">'+ROLE[r][1]+'이(가) 모두 탈락했어요. 들키지 않게 부르는 척만 하고 넘어가세요.</p>');
        else if(s.step===3&&sec.checked!=null){ const t=s.players.find(p=>p.pid===sec.checked); M.insertAdjacentHTML('beforeend',checkHTML({pid:sec.checked,maf:t&&t.role==='maf'})+'<p class="g-sub center-t">결과가 경찰 폰에 떴어요 ✔︎</p>'); }
        else { M.insertAdjacentHTML('beforeend','<p class="g-sub center-t">가리킨 사람의 번호를 누르세요'+(s.step===3?' (결과는 경찰 폰에만 떠요)':'')+'</p>');
          M.appendChild(grPickGrid(alive,cur,t=>grHost('pick',{t}),p=>ROLE[p.role][0])); }
      }
      M.appendChild(gBtn(s.step===0?'모두 눈 감았어요 →':'다음 →','primary',()=>grHost('next'))); return; }
    const myTurn=me.alive&&auto&&((s.step===1&&me.role==='maf')||(s.step===2&&me.role==='doc')||(s.step===3&&me.role==='pol'));
    if(!myTurn){ stage(titles[s.step]==='🌙 밤'||ghost?titles[s.step]:'🌙 밤','“'+grMafScript(s)+'”');
      if(myChecks.length&&me.role==='pol') M.insertAdjacentHTML('beforeend',myChecks.map(checkHTML).join(''));
      if(!ghost&&!mod) M.insertAdjacentHTML('beforeend','<div class="gr-sleep">😴<span>'+(myChecks.length&&me.role==='pol'?'결과를 확인했으면 눈을 감아 주세요':'눈을 감고 기다려 주세요')+'</span></div>');
      return; }
    if(s.step===1){ const picks=(s.x&&s.x.picks)||[]; stage('🔪 마피아 차례','오늘 밤 제거할 사람을 골라 주세요'+(picks.length?'<br><span class="g-sub">같은 편 선택: '+picks.map(p=>grEsc(p.pid+'번→'+p.t+'번')).join(', ')+'</span>':''));
      M.appendChild(grPickGrid(alive.filter(p=>p.role!=='maf'),me.act&&me.act.t,t=>grAct({t}))); M.insertAdjacentHTML('beforeend','<p class="g-sub center-t">고른 뒤에는 눈을 감아 주세요. 마피아끼리 다르게 고르면 많이 고른 사람이 돼요.</p>'); return; }
    if(s.step===2){ stage('💉 의사 차례','오늘 밤 살릴 사람을 골라 주세요 (나도 돼요)'); M.appendChild(grPickGrid(alive,me.act&&me.act.t,t=>grAct({t}))); return; }
    if(s.step===3){ if(myChecks.length){ stage('🚓 경찰 차례','조사 결과예요. 확인했으면 눈을 감아 주세요.'); M.insertAdjacentHTML('beforeend',myChecks.map(checkHTML).join('')); return; }
      stage('🚓 경찰 차례','조사할 사람을 한 명 골라 주세요 (한 번만 고를 수 있어요)'); M.appendChild(grPickGrid(alive.filter(p=>p.pid!==me.pid),null,t=>grAct({t}))); return; }
  }

  if(s.phase==='day'){ const n=pub.news||{}; const iDied=n.k==='kill'&&n.pid===me.pid;
    if(iDied&&!GR.view['died'+pub.day]){ GR.view['died'+pub.day]=1; gBuzz([400,200,400]); }
    if(iDied) M.insertAdjacentHTML('beforeend','<div class="gr-dead">☠️<b>당신은 지난밤<br>마피아에게 당했습니다</b><span>이제부터 유령이에요. 말하지 말고 조용히 지켜봐 주세요 🤫</span></div>');
    stage('☀️ '+pub.day+'일차 아침','<div class="mf-news">'+(n.k==='kill'?'지난밤 <b>'+grEsc(grNm(n.pid))+'</b>님이 마피아에게 당했어요 😱'+(s.opts.reveal==='on'&&grP(n.pid).role?'<br><span class="g-sub">직업: '+ROLE[grP(n.pid).role][1]+'</span>':''):n.k==='saved'?'마피아의 공격이 있었지만<br><b>의사의 활약</b>으로 아무도 죽지 않았어요 🙌':'아무 일도 없는 조용한 밤이었어요 🌙')+'</div>');
    if(me.role==='pol'&&me.alive){ const all=(me.priv.checks||[]); if(all.length) M.insertAdjacentHTML('beforeend','<details class="g-card"><summary>🔎 내 조사 기록 ('+all.length+')</summary>'+all.map(c=>'<p class="g-sub">'+c.day+'일차: '+grEsc(grNm(c.pid))+' → '+(c.maf?'🔪 마피아':'🙂 마피아 아님')+'</p>').join('')+'</details>'); }
    M.insertAdjacentHTML('beforeend','<div class="g-card center"><h3>💬 낮 토론</h3>'+grTimerHTML()+'</div>'); M.querySelector('.gr-timer').dataset.total=s.opts.talk*60;
    if(host){ const two=document.createElement('div'); two.className='g-two'; two.appendChild(gBtn('+30초','',()=>grHost('addtime'))); two.appendChild(gBtn('🗳️ 투표 시작','primary',()=>grHost('vote'))); M.appendChild(two); }
    else M.insertAdjacentHTML('beforeend','<p class="g-sub center-t">시간이 끝나면 알람이 울리고 투표가 시작돼요</p>'); return; }

  if(s.phase==='vote'){ stage('🗳️ 투표','마피아라고 생각하는 사람에게 투표해 주세요<br><span class="g-sub">개표 전까지는 바꿀 수 있어요</span>');
    if(me.alive&&!mod){ const sel=me.act&&me.act.t; M.appendChild(grPickGrid(alive.filter(p=>p.pid!==me.pid),sel,t=>grAct({t}))); const sk=gBtn(sel===0?'✔︎ 기권했어요':'🙅 기권','ghost',()=>grAct({t:0})); M.appendChild(sk); }
    else M.insertAdjacentHTML('beforeend','<p class="g-sub center-t">'+(mod?'참가자들이 폰으로 투표하고 있어요':'유령은 투표할 수 없어요 👻')+'</p>');
    if(mod&&s.x&&s.x.votes) M.insertAdjacentHTML('beforeend','<div class="gr-votes">'+Object.entries(s.x.votes).map(([v,t])=>'<span>'+v+'번 → '+(t?t+'번':'기권')+'</span>').join('')+'</div>');
    M.insertAdjacentHTML('beforeend','<p class="gr-prog g-sub center-t" data-pool="alive" data-label="투표한 사람"></p>');
    if(host) M.appendChild(gBtn('개표하기','',()=>grHost('tally'))); return; }

  if(s.phase==='voted'){ const v=pub.vote||{}, out=v.out; const iOut=out===me.pid;
    if(iOut) M.insertAdjacentHTML('beforeend','<div class="gr-dead">😵<b>당신은 투표로<br>탈락했습니다</b><span>이제부터 유령이에요. 조용히 지켜봐 주세요 🤫</span></div>');
    const cnt={}; Object.values(v.votes||{}).forEach(t=>{ if(t) cnt[t]=(cnt[t]||0)+1; });
    stage('🗳️ 투표 결과','<div class="mf-news">'+(out?'<b>'+grEsc(grNm(out))+'</b>님이 탈락했어요'+(s.opts.reveal==='on'&&grP(out).role?'<br><span class="g-sub">직업: '+ROLE[grP(out).role][0]+' '+ROLE[grP(out).role][1]+'</span>':''):'표가 갈려서 아무도 탈락하지 않았어요')+'</div><div class="gr-votes dark">'+Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([t,c])=>'<span>'+grEsc(grNm(+t))+' '+'🗳️'.repeat(c)+'</span>').join('')+'</div>');
    if(host) M.appendChild(gBtn('🌙 다음 밤','primary',()=>grHost('night'))); else grWaitHost(M,'방장이 다음 밤을 시작해요'); return; }

  if(s.phase==='end'){ const cw=pub.winner==='cit', mine=me.role==='maf'?!cw:cw; if(!GR.view.mend){ GR.view.mend=1; mod||mine?gaFanfare():gBuzz(200); }
    M.insertAdjacentHTML('beforeend','<div class="g-reveal big '+(cw?'':'liar')+'"><small>'+(mod?'게임 끝!':mine?'🎉 우리 팀 승리!':'😢 아쉬워요')+'</small><div class="g-word">'+(cw?'🙂 시민 팀 승리!':'🔪 마피아 팀 승리!')+'</div><p>'+(cw?'마피아를 모두 찾아냈어요!':'마피아 수가 시민 수만큼 남았어요')+'</p></div>');
    if(!mod&&!ghost) M.insertAdjacentHTML('beforeend',grRoleTable());
    const log=(pub.log||[]).map(l=>l.day+'일차 '+(l.k==='kill'?'밤: '+grNm(l.pid)+' 당함':l.k==='saved'?'밤: 의사가 살림':l.k==='none'?'밤: 조용함':'낮: '+(l.pid?grNm(l.pid)+' 투표로 탈락':'투표 무효')));
    if(log.length) M.insertAdjacentHTML('beforeend','<div class="g-card"><h3>📜 진행 기록</h3><p class="g-sub" style="line-height:1.8;margin:0">'+log.map(grEsc).join('<br>')+'</p></div>');
