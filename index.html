function grDeepLink(){ const m=location.search.match(/[?&]room=(\d{4})/); if(!m) return; try{ history.replaceState(null,'',location.pathname+'#talk'); }catch(e){}
  setTimeout(async()=>{ setTab('talk'); await renderTalk(); const b=document.querySelector('.sg-tabs button[data-p=game]'); if(b) b.click(); GR.pending=m[1]; openGame('online'); },400); }
// 6) 보드게임: 말씀 순례길
function gBoard(B){
  const N=30; const st={n:4};
  // 칸 종류: 0 출발, 29 도착
  const KIND={bless:['✨','축복','2칸 앞으로!'],trial:['🌧️','시험','2칸 뒤로…'],quiz:['❓','퀴즈','OX 퀴즈! 맞히면 2칸 앞으로'],talk:['💬','나눔','나눔 질문에 답해요'],again:['🔁','은혜','한 번 더 굴려요!'],pray:['🙏','기도','오른쪽 사람이 나를 위해 한 문장 기도해 줘요'],rest:['⛺','안식','한 번 쉬어요']};
  const layout=['start','','quiz','bless','','talk','trial','','pray','quiz','','again','talk','','trial','bless','quiz','','rest','talk','','pray','quiz','trial','','bless','talk','quiz','again','goal'];
  let pl=[], turn=0, finished=[], busy=false; let quitAsk=0; const confirmQuit=()=>{ if(Date.now()-quitAsk<3000) return true; quitAsk=Date.now(); toast('한 번 더 누르면 처음부터 다시 시작해요'); return false; };
  const setup=()=>{ B.innerHTML='<div class="g-card"><h3>말씀 순례길 🗺️</h3><p class="g-desc">주사위를 굴려 출발부터 도착(새 예루살렘)까지 먼저 가는 게임이에요. 칸마다 <b>✨축복 · 🌧️시험 · ❓퀴즈 · 💬나눔 · 🙏기도 · 🔁은혜 · ⛺안식</b>이 기다려요. 폰을 다음 사람에게 넘기며 해요!</p></div>';
    B.firstChild.appendChild(gStepper('👥 인원',2,15,st.n,v=>st.n=v)); B.appendChild(gBtn('게임 시작','primary',()=>{ pl=[...Array(st.n).keys()].map(i=>({i,pos:0,skip:false,ic:G_ANI[i],c:G_COLORS[i]})); turn=0; finished=[]; draw(); })); };
  const cellXY=k=>{ const cols=5, r=Math.floor(k/cols), c=r%2?cols-1-(k%cols):k%cols; return {r,c}; };
  const draw=(msg,canRoll)=>{ if(canRoll===undefined) canRoll=!msg; const cur=pl[turn];
    let h='<div class="bd-top"><span class="bd-me" style="background:'+cur.c+'">'+cur.ic+' '+(cur.i+1)+'번 차례</span><span class="bd-fin">'+(finished.length?'🏁 '+finished.map(p=>p.ic).join(''):'')+'</span></div><div class="bd-grid">';
    const cells=[]; for(let k=0;k<N;k++){ const {r,c}=cellXY(k); const kind=k===0?'start':k===N-1?'goal':layout[k]; const lab=kind==='start'?'🚩<small>출발</small>':kind==='goal'?'🏰<small>도착</small>':kind?KIND[kind][0]+'<small>'+KIND[kind][1]+'</small>':'<small>'+(k)+'</small>';
      const toks=pl.filter(p=>p.pos===k&&!finished.includes(p)).map(p=>'<i style="background:'+p.c+'"'+(p===cur?' class="me"':'')+'>'+p.ic+'</i>').join('');
      cells[r*5+c]='<div class="bd-cell k-'+(kind||'plain')+'" style="grid-row:'+(6-r)+';grid-column:'+(c+1)+'"><span class="lab">'+lab+'</span><span class="toks">'+toks+'</span></div>'; }
    h+=cells.join('')+'</div><div class="bd-msg"></div>'+(canRoll?'<div class="bd-dice"><div class="dice" id="bdDice">🎲</div></div>':'');
    B.innerHTML=h; const M=B.querySelector('.bd-msg'); M.innerHTML=msg||'주사위를 눌러 굴리세요!';
    if(canRoll){ $('bdDice').onclick=roll; B.appendChild(gBtn('🎲 주사위 굴리기','primary',roll)); } B.appendChild(gBtn('처음부터','ghost',()=>{ if(confirmQuit()) setup(); })); };
  const nextTurn=()=>{ if(finished.length>=pl.length-1&&pl.length>1){ return over(); } do{ turn=(turn+1)%pl.length; }while(finished.includes(pl[turn])); const p=pl[turn]; if(p.skip){ p.skip=false; draw(p.ic+' '+(p.i+1)+'번은 ⛺ 안식 중이라 한 번 쉬어요'); setTimeout(nextTurn,1400); return; } draw(); };
  const moveTo=(p,to,cb)=>{ to=Math.max(0,Math.min(N-1,to)); const step=to>p.pos?1:-1; const go=()=>{ if(p.pos===to) return cb(); p.pos+=step; draw('<b>'+p.ic+'</b> 이동 중…'); setTimeout(go,170); }; go(); };
  const roll=()=>{ if(busy||!$('bdDice')) return; busy=true; const p=pl[turn], D=$('bdDice'); B.querySelectorAll('.gbtn').forEach(b=>b.disabled=true); let k=0; const faces='⚀⚁⚂⚃⚄⚅'; const n=1+Math.floor(Math.random()*6);
    const spin=setInterval(()=>{ D.textContent=faces[Math.floor(Math.random()*6)]; D.classList.toggle('sp'); if(++k>9){ clearInterval(spin); D.textContent=faces[n-1]; gBuzz(30); setTimeout(()=>moveTo(p,p.pos+n,()=>land(p,n)),350); } },70); };
  const land=(p,n)=>{ busy=false; if(p.pos>=N-1){ finished.push(p); gBuzz([60,40,60,40,160]); draw('🎉 <b>'+p.ic+' '+(p.i+1)+'번</b>이 '+finished.length+'등으로 도착했어요!'); B.appendChild(gBtn('다음 사람 →','',nextTurn)); if(finished.length===1) celebrate(p); return; }
    const kind=layout[p.pos]; const who=p.ic+' '+(p.i+1)+'번';
    if(!kind){ draw(who+' 🎲'+n+' → '+p.pos+'칸'); B.appendChild(gBtn('다음 사람 →','',nextTurn)); return; }
    const K=KIND[kind]; const head='<b>'+K[0]+' '+K[1]+' 칸!</b> '+K[2];
    if(kind==='bless'){ draw(head); setTimeout(()=>moveTo(p,p.pos+2,()=>{ draw(who+' ✨ 축복으로 2칸 앞으로 왔어요'); B.appendChild(gBtn('다음 사람 →','',nextTurn)); }),900); return; }
    if(kind==='trial'){ draw(head); setTimeout(()=>moveTo(p,p.pos-2,()=>{ draw(who+' 🌧️ 시험을 만나 2칸 뒤로… 힘내요!'); B.appendChild(gBtn('다음 사람 →','',nextTurn)); }),900); return; }
    if(kind==='again'){ draw(head+'<br>'+who+', 한 번 더 굴려요!',true); return; }
    if(kind==='rest'){ p.skip=true; draw(head+'<br>'+who+'는 다음 차례에 한 번 쉬어요'); B.appendChild(gBtn('다음 사람 →','',nextTurn)); return; }
    if(kind==='pray'){ draw(head+'<br>🙏 '+who+'의 오른쪽 사람이 짧게 축복 기도해 주세요'); B.appendChild(gBtn('아멘! 다음 사람 →','',nextTurn)); return; }
    if(kind==='talk'){ const q=(TALK.all&&TALK.all.length?gRand(TALK.all).q:'요즘 가장 감사한 일은 무엇인가요?'); draw(head+'<div class="bd-q">💬 '+q.replace(/</g,'&lt;')+'</div>'); B.appendChild(gBtn('답했어요! 다음 사람 →','',nextTurn)); return; }
    if(kind==='quiz'){ const q=gRand(GD.ox); draw(head+'<div class="bd-q">❓ '+q.q.replace(/</g,'&lt;')+'</div>'); const two=document.createElement('div'); two.className='g-two';
      const ans=pick=>{ const ok=pick===q.a; gBuzz(ok?[30,30,60]:120); draw((ok?'⭕ 정답! ':'❌ 아쉬워요. ')+'정답은 <b>'+(q.a==='O'?'⭕':'❌')+'</b><div class="bd-ref">📖 '+q.r.replace(/</g,'&lt;')+'</div>'); if(ok) setTimeout(()=>moveTo(p,p.pos+2,()=>{ draw(who+' ⭕ 정답 보너스로 2칸 앞으로!'); B.appendChild(gBtn('다음 사람 →','',nextTurn)); }),1300); else B.appendChild(gBtn('다음 사람 →','',nextTurn)); };
      two.appendChild(gBtn('⭕','primary',()=>ans('O'))); two.appendChild(gBtn('❌','primary',()=>ans('X'))); B.insertBefore(two,B.querySelector('.gbtn')); return; }
  };
  const celebrate=p=>{ try{ gameCelebrate('🏰 '+p.ic+' '+(p.i+1)+'번 도착!','새 예루살렘에 가장 먼저 도착했어요. 남은 사람들도 끝까지 함께 가요!',true); }catch(e){} };
  const over=()=>{ const last=pl.find(p=>!finished.includes(p)); if(last) finished.push(last); B.innerHTML='<div class="g-reveal big"><small>순례 완료!</small><div class="g-word">🏆 '+finished[0].ic+' '+(finished[0].i+1)+'번 우승</div><p>'+finished.map((p,i)=>(i+1)+'등 '+p.ic+' '+(p.i+1)+'번').join(' · ')+'</p></div>'; B.appendChild(gBtn('다시 하기','primary',()=>{ pl.forEach(p=>{p.pos=0;p.skip=false;}); turn=0; finished=[]; draw(); })); B.appendChild(gBtn('인원 바꾸기','',setup)); };
  setup();
}

let JUBO=null;
function repaint(el){ requestAnimationFrame(()=>{ el.style.willChange='transform'; el.style.transform='translateZ(0) scale(1.0001)'; requestAnimationFrame(()=>{ el.style.transform='translateZ(0)'; el.style.willChange=''; }); }); } // 휴대폰이 그림을 다시 그리게 살짝 건드려요
// 홈·주보 화면의 모든 그림(라이브 썸네일, 영상 썸네일 등)은 다 받으면 한 번 더 그려요 (갤럭시 흰 화면 방지)
document.addEventListener('load',e=>{ const t=e.target; if(t&&t.tagName==='IMG'&&t.closest('.home,#juboSheet')) repaint(t); },true);
const JIMG=u=>'api/jubo-img?u='+encodeURIComponent(u); // 주보 그림은 우리 서버를 거쳐서 받아요 (휴대폰에서 막히는 것 방지)
async function loadJubo(){
  const card=$('juboCard');
  try{
    const r=await fetch('api/bulletin'); const j=await r.json(); if(!r.ok) throw j;
    JUBO=j;
    const img=document.createElement('img'); img.alt=''; img.referrerPolicy='no-referrer'; let tr=0; const alts=[j.cover,JIMG(j.pages[0]),j.pages[0]]; img.onerror=()=>{ if(++tr<alts.length) img.src=alts[tr]; }; img.onload=()=>repaint(img); img.src=JIMG(j.cover);
    card.firstElementChild.replaceWith(img);
    card.querySelector('b').textContent=j.label;
    $('juboInfo').textContent='오륜교회 · '+j.pages.length+'쪽';
    if(!card.querySelector('.go')) card.lastElementChild.insertAdjacentHTML('beforeend','<span class="go">주보 펼쳐 보기 ›</span>');
  }catch(e){
    JUBO={source:'https://oryun.org/life/?menu=255',error:true};
    $('juboInfo').textContent='지금 주보를 불러오지 못했어요. 누르면 오륜교회 홈페이지에서 볼 수 있어요.';
  }
}
$('juboCard').onclick=()=>{
  if(!JUBO||JUBO.error){ window.open((JUBO&&JUBO.source)||'https://oryun.org/life/?menu=255','_blank','noopener'); return; }
  const s=$('juboSheet'); s.innerHTML='<div class="grab"></div><h2></h2><div class="ref-en">오륜교회 · 매주 자동으로 새 주보가 올라와요</div><div class="jubo-actions"></div><div class="jubo-pages"></div><div class="row"><button class="btn" type="button" id="juboClose">닫기</button></div>';

  const o=document.createElement('a');o.href=JUBO.source;o.target='_blank';o.rel='noopener';o.textContent='오륜교회 홈페이지 ↗';A.appendChild(o);

    const wrap=document.createElement('div'); wrap.className='jubo-page'; wrap.innerHTML='<span class="jp-load"><i class="tts-load"></i>'+(i+1)+'쪽 불러오는 중…</span>';

  });
  $('juboClose').onclick=closeAll;
  open(s); s.scrollTop=0; setTimeout(()=>s.querySelectorAll('.jubo-page.ok img').forEach(repaint),300);
};

if(IS_IOS&&!isStandalone()){ $('installBtn').hidden=false; $('installBtn').textContent='홈 화면에 추가'; $('shareTitle').textContent='원파이브를 앱처럼 설치하세요'; $('shareSub').textContent='Safari 공유 버튼 → 홈 화면에 추가'; }
